server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Symfony front controller pattern.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS off;

        # Désactive le buffering nginx pour permettre le streaming SSE
        # (sinon les events PHP attendent que le buffer soit plein).
        fastcgi_buffering off;
        gzip off;
        proxy_buffering off;

        # Empêche l'exécution d'autres .php que le front controller.
        internal;
    }

    # 404 sur tout autre .php — sécurité défensive.
    location ~ \.php$ {
        return 404;
    }

    # Assets statiques — cache long si présent sur disque, sinon délègue au front controller
    # (asset-mapper en dev sert les fichiers via une route Symfony).
    location ~* \.(?:css|js|map|gif|ico|jpe?g|png|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri /index.php$is_args$args;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    client_max_body_size 16m;

    error_log  /var/log/nginx/docconnect_error.log warn;
    access_log /var/log/nginx/docconnect_access.log;
}
