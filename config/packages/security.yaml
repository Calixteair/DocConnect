security:
    providers:
        firebase_users:
            id: App\Security\FirebaseUserProvider

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: firebase_users
            custom_authenticators:
                - App\Security\FirebaseAuthenticator
            entry_point: App\Security\FirebaseAuthenticator

    access_control:
        - { path: ^/login,   roles: PUBLIC_ACCESS }
        - { path: ^/signup,  roles: PUBLIC_ACCESS }
        - { path: ^/auth/,   roles: PUBLIC_ACCESS }
        - { path: ^/logout,  roles: PUBLIC_ACCESS }
        - { path: ^/app/,    roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
